[project]
name = "movila"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.4.0",
    "dbos>=3.4.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
voice = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
movila = "movila.cli:main"
movila-voice = "movila.voice.cli:main"
movila-eval = "evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["movila", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
